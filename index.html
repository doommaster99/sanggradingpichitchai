<title>สั่นกระดิ่งพิชิตชัย</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: glass dashboard on a soft mesh gradient. Setup = hero, KPI row, mode cards, start card + question-set insight card.
   Game = glass HUD, question card, status pill, answer tiles, bell pads. Everything is built from the tokens below. */
:root{
  --font-display:'Noto Sans Thai','Sarabun',system-ui,sans-serif;
  --font-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --bg:#EEF1FF; --blob1:#C7D2FE; --blob2:#FBCFE8; --blob3:#A5F3FC;
  --ink:#0F172A; --ink-2:#475569; --line:rgba(99,102,241,.18); --fill:rgba(99,102,241,.09);
  --glass:rgba(255,255,255,.60); --glass-2:rgba(255,255,255,.82); --glass-solid:rgba(255,255,255,.90); --glass-brd:rgba(255,255,255,.80);
  --shadow:0 14px 40px -16px rgba(67,56,202,.32), 0 2px 8px rgba(15,23,42,.05);
  --shadow-lg:0 26px 60px -18px rgba(67,56,202,.42), 0 4px 14px rgba(15,23,42,.07);
  --accent:#4F46E5; --accent-ink:#FFFFFF;
  --grad:linear-gradient(135deg,#4F46E5 0%,#7C3AED 55%,#DB2777 100%);
  --grad-gold:linear-gradient(135deg,#FCD34D,#F59E0B 55%,#F97316); --gold-ink:#422006;
  --good:#047857; --good-bg:rgba(16,185,129,.16); --bad:#BE123C; --bad-bg:rgba(244,63,94,.14);
  --lv-e:#10B981; --lv-m:#F59E0B; --lv-h:#F43F5E;
  --p1:#3B6CF0; --p2:#E0700F; --p3:#E0364F; --p4:#475569; --p5:#0E9F6E; --p6:#8250F0;
  --r:1.75rem; --ease:cubic-bezier(.22,.8,.3,1);
  --scale:1; font-size:calc(16px * var(--scale));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080C20; --blob1:rgba(79,70,229,.55); --blob2:rgba(190,24,93,.38); --blob3:rgba(14,116,144,.50);
    --ink:#EAEEFF; --ink-2:#A8B4D6; --line:rgba(165,180,252,.20); --fill:rgba(165,180,252,.10);
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --glass-solid:rgba(22,28,64,.90); --glass-brd:rgba(255,255,255,.14);
    --shadow:0 16px 44px -16px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.25);
    --shadow-lg:0 28px 64px -18px rgba(0,0,0,.75), 0 4px 14px rgba(0,0,0,.3);
    --accent:#A5B4FC; --accent-ink:#0B1030;
    --good:#34D399; --good-bg:rgba(16,185,129,.20); --bad:#FB7185; --bad-bg:rgba(244,63,94,.20);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080C20; --blob1:rgba(79,70,229,.55); --blob2:rgba(190,24,93,.38); --blob3:rgba(14,116,144,.50);
  --ink:#EAEEFF; --ink-2:#A8B4D6; --line:rgba(165,180,252,.20); --fill:rgba(165,180,252,.10);
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --glass-solid:rgba(22,28,64,.90); --glass-brd:rgba(255,255,255,.14);
  --shadow:0 16px 44px -16px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.25);
  --shadow-lg:0 28px 64px -18px rgba(0,0,0,.75), 0 4px 14px rgba(0,0,0,.3);
  --accent:#A5B4FC; --accent-ink:#0B1030;
  --good:#34D399; --good-bg:rgba(16,185,129,.20); --bad:#FB7185; --bad-bg:rgba(244,63,94,.20);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font:400 1rem/1.55 var(--font-body);
  background:
    radial-gradient(62rem 40rem at 6% -10%, var(--blob1), transparent 62%),
    radial-gradient(52rem 36rem at 102% 2%, var(--blob2), transparent 58%),
    radial-gradient(58rem 42rem at 55% 118%, var(--blob3), transparent 62%),
    var(--bg);
  background-attachment:fixed;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit}
svg{flex:none}
kbd{font:700 .7rem/1 var(--font-body); padding:.25em .5em; border-radius:.5rem; background:var(--fill); border:1px solid var(--line); opacity:.85}
@media (hover:none){ kbd{display:none} }
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

#app{height:100%; display:flex; flex-direction:column; gap:14px; max-width:1500px; margin:0 auto}
#screen{flex:1; min-height:0; overflow:auto; padding:6px 6px 18px; scrollbar-gutter:stable}
.glass{background:var(--glass); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-brd); border-radius:var(--r); box-shadow:var(--shadow)}

/* header */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:.3rem .2rem}
.brand{display:flex; align-items:center; gap:.75rem; font:800 1.3rem/1 var(--font-display)}
.brand .mark{display:grid; place-items:center; width:2.6rem; height:2.6rem; border-radius:1rem; background:var(--grad); color:#fff; box-shadow:0 8px 20px -6px rgba(124,58,237,.6)}
.brand .mark svg{width:1.4rem; height:1.4rem}
.tools{display:flex; gap:.5rem; flex-wrap:wrap}
.ibtn{display:inline-flex; align-items:center; justify-content:center; gap:.45rem; min-width:2.8rem; height:2.8rem; padding:0 .9rem; cursor:pointer;
  background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--glass-brd); border-radius:1rem; box-shadow:var(--shadow);
  font:700 .92rem/1 var(--font-display); transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s}
.ibtn svg{width:1.2rem; height:1.2rem}
.ibtn:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); background:var(--glass-2)}
.ibtn:active{transform:translateY(0) scale(.97)}

/* buttons / form */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:.55rem; padding:.7em 1.25em; cursor:pointer;
  font:700 1rem/1.2 var(--font-display); color:var(--ink); background:var(--glass-2); border:1px solid var(--glass-brd); border-radius:1.1rem; box-shadow:var(--shadow);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), filter .25s}
.btn svg{width:1.2em; height:1.2em}
.btn:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 14px 30px -10px rgba(124,58,237,.65)}
.btn.primary:hover{filter:brightness(1.08); box-shadow:0 20px 38px -10px rgba(124,58,237,.75)}
.btn.gold{background:var(--grad-gold); color:var(--gold-ink); border-color:transparent; box-shadow:0 14px 30px -10px rgba(245,158,11,.6)}
.btn.small{padding:.5em 1em; font-size:.92rem; border-radius:.95rem}
.btn.big{font-size:1.3rem; padding:.85em 1.6em; flex:1}
.chip{display:inline-flex; align-items:center; padding:.4em 1em; min-height:2.4rem; cursor:pointer; background:var(--fill); border:1px solid var(--line); border-radius:999px;
  font:700 .92rem/1.1 var(--font-display); transition:transform .2s var(--ease), background .2s, box-shadow .2s}
.chip:hover{transform:translateY(-1px); background:var(--glass-2)}
.chip.on{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 8px 18px -8px rgba(124,58,237,.7)}
.chip:disabled{opacity:.4; cursor:not-allowed; transform:none}
.numin,.txtin,.txtarea{background:var(--glass-2); color:var(--ink); border:1px solid var(--line); border-radius:.95rem; font:600 1rem var(--font-body); transition:border-color .2s, box-shadow .2s}
.numin{width:6rem; height:2.5rem; padding:0 .7rem}
.txtin{flex:1; min-width:0; height:2.7rem; padding:0 .9rem}
.txtarea{width:100%; min-height:7rem; padding:.7rem .9rem; font-weight:500; font-size:.95rem; line-height:1.45; resize:vertical}
.numin:focus,.txtin:focus,.txtarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--fill)}
.row{display:flex; flex-direction:column; gap:.55rem}
.row>label,.row>.lb{font:700 1rem/1.3 var(--font-display)}
.row>.txtin{flex:none; width:100%}
.row .hint{font-size:.88rem; color:var(--ink-2)}
.chips{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center}
.names{display:grid; gap:.55rem}
.nrow{display:flex; align-items:center; gap:.6rem}
.sw{display:grid; place-items:center; width:2.7rem; height:2.7rem; flex:none; border-radius:1rem; background:var(--pc); font-size:1.4rem; box-shadow:0 8px 18px -8px var(--pc)}
[data-mode="solo"] .only-bell,[data-mode="bell"] .only-solo{display:none}

/* setup dashboard */
.dash{display:grid; gap:1.25rem; max-width:74rem; margin:0 auto; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
  grid-template-areas:"hero hero" "kpi kpi" "modes modes"}
.dash>*{animation:rise .6s var(--ease) both}
.dash>:nth-child(2){animation-delay:.06s} .dash>:nth-child(3){animation-delay:.12s} .dash>:nth-child(4){animation-delay:.18s} .dash>:nth-child(5){animation-delay:.24s}
.hero{grid-area:hero; position:relative; overflow:hidden; padding:clamp(1.5rem,3.4vw,2.8rem)}
.hero::before{content:""; position:absolute; right:-6rem; top:-7rem; width:22rem; height:22rem; border-radius:50%; background:var(--grad); opacity:.22; filter:blur(50px); pointer-events:none}
.hero>*{position:relative}
.eyebrow{display:inline-flex; align-items:center; gap:.5rem; padding:.4em 1em; border-radius:999px; background:var(--fill); border:1px solid var(--line); color:var(--accent); font:700 .9rem/1.3 var(--font-display)}
.eyebrow svg{width:1.1rem; height:1.1rem}
h1{margin:1rem 0 0; font:800 clamp(2.4rem,6vw,4.4rem)/1.15 var(--font-display); text-wrap:balance; color:var(--accent);
  background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.lead{margin:1rem 0 0; max-width:40rem; font-size:1.15rem; color:var(--ink-2)}
.feats{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.4rem}
.feats span{display:inline-flex; align-items:center; gap:.5rem; padding:.45em 1em; border-radius:999px; background:var(--glass-2); border:1px solid var(--glass-brd); font:600 .92rem var(--font-body)}
.feats svg{width:1.1rem; height:1.1rem; color:var(--accent)}
.kpis{grid-area:kpi; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1.1rem}
.kpi{display:grid; grid-template-columns:auto 1fr; align-items:center; column-gap:.9rem; padding:1.1rem 1.2rem; text-align:left; cursor:pointer; transition:transform .3s var(--ease), box-shadow .3s var(--ease)}
.kpi:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg)}
.ico{display:grid; place-items:center; width:2.9rem; height:2.9rem; border-radius:1.05rem; background:var(--grad); color:#fff; box-shadow:0 10px 22px -8px rgba(124,58,237,.6)}
.ico svg{width:1.4rem; height:1.4rem}
.kpi .ico{grid-row:1 / span 2}
.kl{font:600 .85rem/1.2 var(--font-body); color:var(--ink-2)}
.kpi b{font:800 1.35rem/1.25 var(--font-display); overflow-wrap:anywhere}
.modes{grid-area:modes; display:grid; grid-template-columns:1fr 1fr; gap:1.1rem}
.mode{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:.5rem; padding:1.3rem; text-align:left; cursor:pointer; border:2px solid transparent;
  transition:transform .3s var(--ease), box-shadow .3s var(--ease), background .3s}
.mode:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg)}
.mode .ic{display:grid; place-items:center; width:3.2rem; height:3.2rem; border-radius:1.1rem; background:var(--fill); color:var(--accent)}
.mode .ic svg{width:1.6rem; height:1.6rem}
.mode b{font:800 1.3rem/1.2 var(--font-display)}
.mode .d{font-size:.95rem; color:var(--ink-2)}
.mode .tick{position:absolute; right:1rem; top:1rem; display:grid; place-items:center; width:1.8rem; height:1.8rem; border-radius:50%; background:var(--grad); color:#fff; opacity:0; transform:scale(.4); transition:.3s var(--ease)}
.mode .tick svg{width:1rem; height:1rem; stroke-width:3}
.mode.on{background:linear-gradient(var(--glass-solid),var(--glass-solid)) padding-box, var(--grad) border-box; box-shadow:var(--shadow-lg)}
.mode.on .ic{background:var(--grad); color:#fff}
.mode.on .tick{opacity:1; transform:scale(1)}
.startc{grid-area:start; display:flex; flex-direction:column; gap:1rem; padding:1.3rem}
.summary{margin:0; color:var(--ink-2); font-size:.95rem}
.startrow{display:flex; gap:.8rem; flex-wrap:wrap}
.setc{grid-area:set; display:flex; flex-direction:column; gap:1rem; padding:1.4rem}
.setc-h{display:flex; align-items:center; gap:.9rem}
.setc-h h2{margin:0; font:800 1.25rem/1.3 var(--font-display); overflow-wrap:anywhere}
.bigno{display:flex; align-items:baseline; gap:.5rem}
.bigno b{font:800 3.4rem/1 var(--font-display); color:var(--accent)}
.bigno span{font:700 1.1rem var(--font-display); color:var(--ink-2)}
.lvbar{display:flex; height:.9rem; border-radius:999px; overflow:hidden; background:var(--fill)}
.lvbar i{display:block; height:100%; transition:width .5s var(--ease)} .lvbar i+i{margin-left:2px}
.lvbar .e,.legend .e{background:var(--lv-e)} .lvbar .m,.legend .m{background:var(--lv-m)} .lvbar .h,.legend .h{background:var(--lv-h)}
.legend{display:flex; flex-wrap:wrap; gap:.4rem 1.1rem; margin:0; padding:0; list-style:none; font-size:.92rem; color:var(--ink-2)}
.legend li{display:inline-flex; align-items:center; gap:.4rem} .legend i{width:.7rem; height:.7rem; border-radius:50%} .legend b{color:var(--ink)}
.tcs{display:flex; flex-wrap:wrap; gap:.45rem}
.tc{padding:.3em .85em; border-radius:999px; background:var(--fill); border:1px solid var(--line); font:600 .88rem var(--font-body)}
.tc b{color:var(--accent)}

/* game */
.game{height:100%; display:flex; flex-direction:column; gap:.9rem; min-height:0}
.hud{display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap; padding:.85rem 1.2rem}
.hq,.ht{display:flex; align-items:center; gap:.8rem}
.hico{display:grid; place-items:center; width:2.7rem; height:2.7rem; border-radius:1rem; background:var(--grad); color:#fff; flex:none}
.hico svg{width:1.4rem; height:1.4rem}
.hud .lbl{display:block; font:600 .8rem/1.2 var(--font-body); color:var(--ink-2)}
.hq b{font:800 2rem/1 var(--font-display)} .hq .of{font:700 1.1rem var(--font-display); color:var(--ink-2); margin-left:.3rem}
.ht{flex:1; min-width:13rem}
.htb{display:flex; flex-direction:column; min-width:4.6rem}
.ht b{font:800 2rem/1 var(--font-display); font-variant-numeric:tabular-nums}
.tbar{flex:1; min-width:4rem; height:.8rem; border-radius:999px; background:var(--fill); overflow:hidden}
.tbar i{display:block; height:100%; width:100%; background:var(--grad); border-radius:inherit; transition:width .2s linear}
.ht.low b{color:var(--bad)} .ht.low .tbar i{background:var(--lv-h)} .ht.low{animation:blink 1s steps(2,jump-none) infinite}
.keyhint{font-size:.85rem; color:var(--ink-2)}
.stage{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:.85rem; padding:2px 4px 10px; position:relative}
.qcard{padding:1.4rem 1.6rem; animation:rise .45s var(--ease) both}
.tags{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.7rem}
.tag{padding:.15em .85em; border-radius:999px; font:700 .85rem/1.6 var(--font-display); background:var(--fill); border:1px solid var(--line)}
.tag.d-e{background:var(--good-bg); color:var(--good)} .tag.d-m{background:rgba(245,158,11,.18); color:#B45309} .tag.d-h{background:var(--bad-bg); color:var(--bad)}
:root[data-theme="dark"] .tag.d-m{color:#FCD34D}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.d-m{color:#FCD34D} }
.qtext{margin:0; font:800 clamp(1.4rem,3vw,2.5rem)/1.4 var(--font-display); text-wrap:pretty}
.ready{display:none; text-align:center; padding:1rem 0}
.ready b{display:block; font:800 clamp(4.5rem,15vw,9.5rem)/1 var(--font-display); color:var(--accent); animation:pop .5s var(--ease)}
.ready span{font:700 1.4rem var(--font-display); color:var(--ink-2)}
.game[data-phase="ready"] .ready{display:block}
.game[data-phase="ready"] .qcard,.game[data-phase="ready"] .choices,.game[data-phase="ready"] .status{display:none}
.status{position:relative; display:flex; align-items:center; justify-content:space-between; gap:1rem; min-height:5.2rem; padding:.7rem 1.2rem; overflow:hidden; transition:background .3s, border-color .3s}
.st-main{display:flex; flex-direction:column; min-width:0}
.st-main .big{display:flex; align-items:center; gap:.6rem; font:800 clamp(1.15rem,2.2vw,1.7rem)/1.3 var(--font-display)}
.st-main .big svg{width:1.5em; height:1.5em}
.st-main .sub{font-size:.95rem; color:var(--ink-2)}
.status.s-question .big svg{color:var(--lv-m)}
.status.s-answering{background:var(--grad-gold); color:var(--gold-ink); border-color:transparent}
.status.s-answering .sub{color:inherit; opacity:.85}
.status.s-correct{background:var(--good-bg); border-color:var(--good)} .status.s-correct .big{color:var(--good)}
.status.s-wrong,.status.s-timeout{background:var(--bad-bg); border-color:var(--bad)} .status.s-wrong .big,.status.s-timeout .big{color:var(--bad)}
.ring{position:relative; width:4.5rem; height:4.5rem; flex:none}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:9}
.ring .bgc{stroke:rgba(66,32,6,.18)} .ring .fgc{stroke:var(--gold-ink); stroke-linecap:round}
.ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:800 2.1rem var(--font-display)}
.ring.hot .fgc{stroke:var(--bad)} .ring.hot b{color:var(--bad)}
.fbbar{position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--fill)}
.fbbar i{display:block; height:100%; width:100%; background:var(--grad)}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:.85rem}
.choice{display:flex; align-items:center; gap:.9rem; padding:.9rem 1.1rem; min-height:4.4rem; text-align:left; cursor:default;
  background:var(--glass-2); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--glass-brd); border-radius:1.4rem; box-shadow:var(--shadow);
  font:700 clamp(1.05rem,1.8vw,1.5rem)/1.35 var(--font-display); transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s, opacity .3s}
.choice .lab{display:grid; place-items:center; flex:none; width:2.6rem; height:2.6rem; border-radius:50%; background:var(--fill); border:1px solid var(--line); color:var(--accent); font:800 1.1rem var(--font-display); transition:.25s}
.choice .txt{flex:1; min-width:0; overflow-wrap:anywhere}
.choices[data-active="true"] .choice{cursor:pointer}
.choices[data-active="true"] .choice:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); background:var(--glass-solid)}
.choices[data-active="true"] .choice:hover .lab{background:var(--grad); color:#fff}
.choices[data-active="true"] .choice:active{transform:scale(.98)}
.choice.correct{background:var(--good-bg); border-color:var(--good)} .choice.correct .lab{background:var(--good); color:#fff; border-color:var(--good)}
.choice.wrong{background:var(--bad-bg); border-color:var(--bad)} .choice.wrong .lab{background:var(--bad); color:#fff; border-color:var(--bad)}
.choice.dim{opacity:.5}
.explain{padding:1rem 1.3rem; background:var(--glass); border:1px dashed var(--line); border-radius:1.4rem; font-size:1.08rem; animation:rise .4s var(--ease) both}
.explain p{margin:.3rem 0 0; color:var(--ink-2)}
.explain[hidden]{display:none}
.pads{display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:.9rem}
.pad{position:relative; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto 1fr; align-items:center; column-gap:.65rem; row-gap:.1rem; overflow:hidden;
  min-height:clamp(6.4rem,17vh,9.5rem); padding:.8rem 1rem; text-align:left; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:var(--r);
  background:var(--pc); background:linear-gradient(150deg,var(--pc),color-mix(in srgb,var(--pc) 60%,#0b1020));
  box-shadow:0 14px 30px -12px rgba(15,23,42,.5); box-shadow:0 16px 34px -12px color-mix(in srgb,var(--pc) 80%,transparent);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), filter .2s, opacity .2s}
.pad:hover{transform:translateY(-3px)}

Q('C','e','กฎหมายต้องประกาศในสิ่งใดจึงจะมีผลบังคับใช้กับประชาชน?',['ราชกิจจานุเบกษา','หนังสือพิมพ์รายวัน','เว็บไซต์ของโรงเรียน','ป้ายประกาศหมู่บ้าน'],'การประกาศในราชกิจจานุเบกษาเป็นการแจ้งให้ประชาชนทราบทั่วกัน'),
Q('A','e','ประมวลกฎหมายแพ่งและพาณิชย์ จัดเป็นกฎหมายประเภทใด?',['กฎหมายเอกชน','กฎหมายมหาชน','กฎหมายระหว่างประเทศ','กฎหมายวิธีสบัญญัติ'],'ประมวลกฎหมายแพ่งและพาณิชย์วางหลักเรื่องสิทธิหน้าที่ของเอกชน จึงเป็นกฎหมายเอกชน'),
Q('B','e','ข้อใดเรียงลำดับศักดิ์ของกฎหมายจากสูงไปต่ำได้ถูกต้อง?',['รัฐธรรมนูญ → พ.ร.บ. → พ.ร.ฎ. → กฎกระทรวง','พ.ร.บ. → รัฐธรรมนูญ → กฎกระทรวง → พ.ร.ฎ.','กฎกระทรวง → พ.ร.ฎ. → พ.ร.บ. → รัฐธรรมนูญ','รัฐธรรมนูญ → กฎกระทรวง → พ.ร.ฎ. → พ.ร.บ.'],'ลำดับคือ รัฐธรรมนูญ → พระราชบัญญัติ → พระราชกฤษฎีกา → กฎกระทรวง → ข้อบัญญัติท้องถิ่น'),
Q('C','e','ข้อบัญญัติท้องถิ่นตราขึ้นโดยหน่วยงานใด?',['องค์กรปกครองส่วนท้องถิ่น','กระทรวง','รัฐสภา','ศาลปกครอง'],'องค์กรปกครองส่วนท้องถิ่น เช่น เทศบาล อบต. อบจ. กรุงเทพมหานคร ออกข้อบัญญัติใช้ในเขตของตน'),
Q('A','e','กฎหมายที่กำหนดว่าการกระทำใดเป็นความผิดและมีโทษ เช่น จำคุก ปรับ คือกฎหมายใด?',['กฎหมายอาญา','กฎหมายแพ่ง','กฎหมายพาณิชย์','กฎหมายครอบครัว'],'กฎหมายอาญากำหนดความผิดและโทษที่รัฐลงแก่ผู้กระทำผิด'),
Q('C','e','ข้อใดเป็นกฎหมายที่ตราเป็นลายลักษณ์อักษร?',['พระราชบัญญัติ','จารีตประเพณีท้องถิ่น','หลักกฎหมายทั่วไป','ความเชื่อของชุมชน'],'กฎหมายลายลักษณ์อักษรคือกฎหมายที่ตราเป็นข้อความเขียนไว้ชัดเจน เช่น รัฐธรรมนูญ พ.ร.บ. กฎกระทรวง'),
Q('A','e','ประมวลกฎหมายมีลักษณะอย่างไร?',['รวบรวมกฎหมายเรื่องเดียวกันไว้เป็นหมวดหมู่','เป็นกฎหมายที่ออกโดยนายกรัฐมนตรี','เป็นกฎหมายที่ใช้เฉพาะในท้องถิ่น','เป็นกฎหมายที่ใช้ชั่วคราวเท่านั้น'],'ประมวลกฎหมายรวบรวมหลักกฎหมายเรื่องเดียวกันอย่างเป็นระบบ เช่น ประมวลกฎหมายอาญา'),
Q('C','e','ข้อใดเป็นตัวอย่างของข้อบัญญัติท้องถิ่น?',['เทศบัญญัติ','พระราชกำหนด','กฎกระทรวง','พระราชกฤษฎีกา'],'เทศบัญญัติเป็นข้อบัญญัติท้องถิ่นที่เทศบาลตราขึ้น'),
Q('A','e','กฎหมายที่กำหนดขั้นตอนการดำเนินคดีในศาล เช่น การฟ้อง การสืบพยาน จัดเป็นกฎหมายประเภทใด?',['กฎหมายวิธีสบัญญัติ','กฎหมายสารบัญญัติ','กฎหมายจารีตประเพณี','กฎหมายระหว่างประเทศ'],'กฎหมายวิธีสบัญญัติบอกวิธีการบังคับใช้สิทธิหน้าที่ เช่น ประมวลกฎหมายวิธีพิจารณาความแพ่ง'),
Q('C','e','ใครเป็นผู้ทรงลงพระปรมาภิไธยในพระราชบัญญัติ เพื่อให้มีผลเป็นกฎหมาย?',['พระมหากษัตริย์','ประธานรัฐสภา','นายกรัฐมนตรี','ประธานศาลฎีกา'],'ร่าง พ.ร.บ. ที่รัฐสภาให้ความเห็นชอบ จะนำขึ้นทูลเกล้าฯ ให้พระมหากษัตริย์ทรงลงพระปรมาภิไธย'),
Q('B','e','ข้อใดมีศักดิ์ต่ำที่สุด?',['ข้อบัญญัติท้องถิ่น','กฎกระทรวง','พระราชกฤษฎีกา','พระราชบัญญัติ'],'ข้อบัญญัติท้องถิ่นมีศักดิ์ต่ำกว่ากฎกระทรวง พระราชกฤษฎีกา และพระราชบัญญัติ'),

Q('B','m','พระราชบัญญัติกับพระราชกำหนด มีศักดิ์เป็นอย่างไร?',['เท่ากัน','พระราชบัญญัติสูงกว่า','พระราชกำหนดสูงกว่า','เทียบศักดิ์กันไม่ได้'],'พ.ร.บ. และ พ.ร.ก. มีศักดิ์เท่ากัน ต่างกันที่ผู้ตราและกรณีที่ใช้'),
Q('C','m','พระราชกำหนดตราโดยฝ่ายใด และตราในกรณีใด?',['คณะรัฐมนตรี ในกรณีเร่งด่วนจำเป็น','รัฐสภา ในสถานการณ์ปกติ','ศาล เมื่อตัดสินคดี','ท้องถิ่น เมื่อเก็บภาษี'],'พ.ร.ก. ตราโดยฝ่ายบริหาร (คณะรัฐมนตรี) เมื่อมีเหตุฉุกเฉินที่จำเป็นรีบด่วน เช่น รักษาความปลอดภัยหรือเศรษฐกิจของประเทศ'),
Q('C','m','เมื่อตราพระราชกำหนดแล้ว ต้องทำอะไรต่อไป?',['เสนอรัฐสภาพิจารณาอนุมัติ','ใช้ได้เลยโดยไม่ต้องเสนอใคร','เสนอศาลฎีกาตรวจสอบ','ประกาศให้ท้องถิ่นรับรอง'],'พ.ร.ก. ต้องเสนอให้รัฐสภาพิจารณาโดยไม่ชักช้า เพื่อให้ฝ่ายนิติบัญญัติตรวจสอบ'),
Q('C','m','พระราชกฤษฎีกาตราขึ้นเพื่ออะไร?',['กำหนดรายละเอียดตามอำนาจรัฐธรรมนูญหรือ พ.ร.บ.','แทน พ.ร.บ. ได้ทุกเรื่อง','แก้ไขเพิ่มเติมรัฐธรรมนูญ','ใช้เฉพาะในท้องถิ่น'],'พ.ร.ฎ. ออกโดยอาศัยอำนาจรัฐธรรมนูญหรือ พ.ร.บ. จึงขัดต่อกฎหมายแม่บทไม่ได้ และไม่ต้องผ่านรัฐสภา'),
Q('C','m','กฎกระทรวงออกโดยใคร?',['รัฐมนตรี','นายกองค์การบริหารส่วนตำบล','ประธานศาลปกครอง','ผู้ว่าราชการจังหวัด'],'รัฐมนตรีออกกฎกระทรวงตามอำนาจที่ พ.ร.บ. ให้ไว้ เพื่อกำหนดรายละเอียดในการใช้ พ.ร.บ. นั้น'),
Q('C','m','เทศบัญญัติเป็นข้อบัญญัติของหน่วยงานใด?',['เทศบาล','องค์การบริหารส่วนตำบล','องค์การบริหารส่วนจังหวัด','กรุงเทพมหานคร'],'เทศบัญญัติตราโดยเทศบาล'),
Q('C','m','องค์การบริหารส่วนตำบล (อบต.) ตรากฎหมายท้องถิ่นที่เรียกว่าอะไร?',['ข้อบัญญัติตำบล','เทศบัญญัติ','ข้อบัญญัติจังหวัด','พระราชกฤษฎีกา'],'อบต. ตราข้อบัญญัติตำบล ส่วน อบจ. ตราข้อบัญญัติจังหวัด'),
Q('C','m','กรุงเทพมหานครตรากฎหมายท้องถิ่นที่เรียกว่าอะไร?',['ข้อบัญญัติกรุงเทพมหานคร','เทศบัญญัติ','ข้อบัญญัติตำบล','กฎกระทรวง'],'กรุงเทพมหานครออกข้อบัญญัติกรุงเทพมหานคร ใช้ในเขตกรุงเทพฯ'),
Q('B','m','พระราชกฤษฎีกากับกฎกระทรวง ฉบับใดมีศักดิ์สูงกว่า?',['พระราชกฤษฎีกา','กฎกระทรวง','เท่ากัน','เทียบศักดิ์กันไม่ได้'],'ลำดับคือ พ.ร.บ. → พ.ร.ฎ. → กฎกระทรวง → ข้อบัญญัติท้องถิ่น'),
Q('B','m','เทศบัญญัติขัดกับกฎกระทรวง ผลเป็นอย่างไร?',['เทศบัญญัติใช้ไม่ได้ในส่วนที่ขัด','กฎกระทรวงใช้ไม่ได้ในส่วนที่ขัด','ใช้ได้ทั้งคู่','ให้ประชาชนเลือกใช้เอง'],'เทศบัญญัติมีศักดิ์ต่ำกว่ากฎกระทรวง จึงขัดหรือแย้งกับกฎกระทรวงไม่ได้'),
Q('A','m','ข้อใดเป็นกฎหมายวิธีสบัญญัติ?',['ประมวลกฎหมายวิธีพิจารณาความอาญา','ประมวลกฎหมายอาญา','ประมวลกฎหมายแพ่งและพาณิชย์','รัฐธรรมนูญ'],'ประมวลกฎหมายวิธีพิจารณาความอาญากำหนดขั้นตอนดำเนินคดีอาญา จึงเป็นกฎหมายวิธีสบัญญัติ'),
Q('A','m','ข้อใดเป็นกฎหมายมหาชน?',['กฎหมายปกครอง','กฎหมายครอบครัว','กฎหมายมรดก','กฎหมายเช่าซื้อ'],'กฎหมายครอบครัว มรดก และเช่าซื้ออยู่ในประมวลกฎหมายแพ่งและพาณิชย์ ซึ่งเป็นกฎหมายเอกชน'),
Q('A','m','กฎหมายสารบัญญัติมีหน้าที่อะไร?',['กำหนดสิทธิ หน้าที่ และความผิดโดยตรง','กำหนดขั้นตอนการดำเนินคดีในศาล','กำหนดความสัมพันธ์ระหว่างประเทศ','กำหนดอำนาจของศาลเท่านั้น'],'กฎหมายสารบัญญัติวางสิทธิหน้าที่ไว้โดยตรง เช่น ประมวลกฎหมายอาญา ประมวลกฎหมายแพ่งและพาณิชย์'),
Q('B','m','ข้อใดเป็นกฎหมายลำดับรอง ที่ออกตามอำนาจของ พ.ร.บ.?',['พระราชกฤษฎีกา','พระราชกำหนด','ประมวลกฎหมาย','พระราชบัญญัติประกอบรัฐธรรมนูญ'],'กฎหมายลำดับรองมีศักดิ์ต่ำกว่า พ.ร.บ. ได้แก่ พ.ร.ฎ. กฎกระทรวง และข้อบัญญัติท้องถิ่น'),
Q('B','m','ประมวลกฎหมาย เช่น ประมวลกฎหมายอาญา มีศักดิ์เท่ากับกฎหมายใด?',['พระราชบัญญัติ','รัฐธรรมนูญ','กฎกระทรวง','ข้อบัญญัติท้องถิ่น'],'ประมวลกฎหมายตราขึ้นเป็น พ.ร.บ. จึงมีศักดิ์เท่ากับ พ.ร.บ.'),
Q('C','m','ประชาชนผู้มีสิทธิเลือกตั้งครบจำนวนตามที่รัฐธรรมนูญกำหนด มีสิทธิทำสิ่งใดเกี่ยวกับกฎหมาย?',['เข้าชื่อเสนอร่างกฎหมาย','ลงพระปรมาภิไธย','ตราพระราชกำหนด','ตัดสินคดีรัฐธรรมนูญ'],'ประชาชนมีส่วนร่วมได้โดยการเข้าชื่อเสนอร่างกฎหมายต่อรัฐสภา'),
Q('A','m','กฎหมายระหว่างประเทศใช้กับเรื่องใด?',['ความสัมพันธ์ระหว่างรัฐกับรัฐ','ความสัมพันธ์ในครอบครัว','ความสัมพันธ์ระหว่างนายจ้างกับลูกจ้าง','ความสัมพันธ์ระหว่างผู้ซื้อกับผู้ขาย'],'กฎหมายระหว่างประเทศควบคุมความสัมพันธ์ระหว่างรัฐกับรัฐและองค์การระหว่างประเทศ เช่น สนธิสัญญา'),
Q('B','m','เหตุใด พระราชบัญญัติ จึงมีศักดิ์สูงกว่ากฎกระทรวง?',['ตราโดยรัฐสภาซึ่งมาจากตัวแทนประชาชน','มีจำนวนมาตรามากกว่า','ออกมาก่อนเสมอ','ลงประกาศในราชกิจจานุเบกษา'],'พ.ร.บ. ผ่านความเห็นชอบของรัฐสภา ส่วนกฎกระทรวงออกโดยฝ่ายบริหารตามอำนาจที่ พ.ร.บ. มอบให้'),

const norm=s=>String(s==null?'':s).replace(/\s+/g,'').toLowerCase();
const ALIAS={t:['หัวข้อ','topic','บทเรียน','เรื่อง','หมวด','หมวดหมู่'],d:['ระดับ','level','ความยาก','ระดับความยาก'],q:['คำถาม','question','โจทย์'],a:['คำตอบที่ถูก','คำตอบที่ถูกต้อง','คำตอบ','เฉลย','correct','answer'],x:['คำอธิบาย','explanation','เหตุผล']};
function headerMap(row){
  const m={t:-1,d:-1,q:-1,a:-1,x:-1,w:[]};
  row.forEach((h,i)=>{const n=norm(h);if(!n)return;let hit=false;
    for(const k of Object.keys(ALIAS)){if(m[k]===-1&&ALIAS[k].includes(n)){m[k]=i;hit=true;break}}
    if(!hit&&/^(ตัวเลือกผิด|ตัวลวง|ตัวเลือก|ผิด|wrong|distractor|incorrect)/.test(n))m.w.push(i);
  });
  return m;
}
function parseDelimited(text){
  text=String(text).replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const D=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&cur===''){q=true}
    else if(c===D){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r')cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function buildQuestions(rows){
  rows=rows.map(r=>r.map(c=>String(c==null?'':c).trim()));
  const hi=rows.findIndex(r=>r.some(c=>c));
  if(hi<0)return{error:'ไม่พบข้อมูล ลองวางข้อมูลรวมแถวหัวตาราง'};
  const skipped=[],warns=[],qs=[];
  let m=headerMap(rows[hi]),start;
  if(m.q>-1&&m.a>-1){
    if(!m.w.length)return{error:'ไม่พบคอลัมน์ “ตัวเลือกผิด” ในหัวตาราง'};
    start=hi+1;
  }else{m={t:0,d:1,q:2,a:3,w:[4,5,6],x:7};start=hi;warns.push({row:'ทั้งหมด',reason:'ไม่พบหัวตาราง จึงใช้ลำดับคอลัมน์ตามแม่แบบ'})}
  const seenQ=new Set(),LV={'ง่าย':'e','easy':'e','e':'e','1':'e','กลาง':'m','ปานกลาง':'m','medium':'m','m':'m','2':'m','ยาก':'h','hard':'h','h':'h','3':'h'};
  for(let i=start;i<rows.length;i++){
    const r=rows[i];if(!r.some(c=>c))continue;
    const row=i+1,get=k=>m[k]>-1?(r[m[k]]||''):'';
    const q=get('q'),a=get('a');
    if(!q){skipped.push({row,reason:'คำถามว่าง'});continue}
    if(!a){skipped.push({row,reason:'ไม่มีคำตอบที่ถูก'});continue}
    if(seenQ.has(norm(q))){skipped.push({row,reason:'คำถามซ้ำกับแถวก่อนหน้า'});continue}
    const seen=new Set([norm(a)]);let wrong=[];
    for(const idx of m.w){const v=r[idx]||'';if(v&&!seen.has(norm(v))){seen.add(norm(v));wrong.push(v)}}
    if(!wrong.length){skipped.push({row,reason:'ต้องมีตัวเลือกผิดอย่างน้อย 1 ข้อ (ไม่ซ้ำกับคำตอบที่ถูก)'});continue}
    if(wrong.length>3){wrong=wrong.slice(0,3);warns.push({row,reason:'มีตัวเลือกผิดเกิน 3 ข้อ ใช้ 3 ข้อแรก'})}
    const ln=norm(get('d'));let d=LV[ln];
    if(!d){d='m';if(ln)warns.push({row,reason:'ไม่รู้จักระดับ “'+get('d')+'” ใช้ “กลาง”'})}
    seenQ.add(norm(q));
    qs.push({t:get('t')||'ทั่วไป',d,q,c:[a,...wrong],x:get('x')});
    if(qs.length>=500){warns.push({row,reason:'ครบ 500 ข้อ ข้ามแถวที่เหลือ'});break}
  }
  return{qs,skipped,warns};
}

function loadXLSX(){

  if(!xlsxP)xlsxP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>{xlsxP=null;rej(new Error('load'))};document.head.appendChild(sc)});
  return xlsxP;
}
async function readFileRows(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    await loadXLSX();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    let pick=null;
    for(const n of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});
      if(!rows.length)continue;
      if(!pick)pick=rows;
      const hr=rows.find(r=>r.some(c=>c));
      if(hr){const m=headerMap(hr);if(m.q>-1&&m.a>-1){pick=rows;break}}
    }
    return pick||[];
  }
  return parseDelimited(await f.text());
}

/* ====== เสียง (สังเคราะห์ด้วย WebAudio) ====== */
let AC=null,master=null;
function ensureAudio(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.connect(AC.destination)}
    if(AC.state==='suspended')AC.resume();
    master.gain.value=S.sound?S.vol:0;
  }catch(e){}
}
function tone(f,t0,d,type,g,to){
  if(!AC||!S.sound)return;
  try{
    const t=AC.currentTime+t0,o=AC.createOscillator(),n=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    n.gain.setValueAtTime(0.0001,t);n.gain.exponentialRampToValueAtTime(g||.3,t+.012);n.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(n);n.connect(master);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
const SFX={
  bell(){tone(1319,0,1,'sine',.4);tone(2637,0,.6,'sine',.16);tone(1976,0,.8,'triangle',.12)},
  correct(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.35,'triangle',.3))},
  wrong(){tone(220,0,.45,'sawtooth',.28,110);tone(165,.02,.45,'square',.12,82)},
  timeout(){tone(300,0,.18,'square',.22);tone(300,.25,.18,'square',.22);tone(180,.5,.5,'sawtooth',.25,90)},
  tick(hot){tone(hot?1500:1000,0,.09,'square',.12)},
  ready(n){tone(n?660:990,0,n?.12:.4,'triangle',.25)},
  fanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.3));tone(1568,.95,.8,'sine',.3)}
};

const fxc=$('#fx'),fctx=fxc.getContext('2d');let parts=[],fxOn=false;
function sizeFx(){const d=window.devicePixelRatio||1;fxc.width=innerWidth*d;fxc.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',sizeFx);sizeFx();
const CONF=['#F5B71B','#2F6BE8','#D63A4A','#0C8F5F','#7A4FE0','#FFFFFF','#FF8A3D'];
function confetti(x,y,n,spread){
  if(reduceMotion())n=Math.min(n,10);
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*14*(spread||1),vy:-Math.random()*13-3,g:.38,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:CONF[i%CONF.length],life:1});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);
  for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vx*=.99;p.life-=.007;
    fctx.save();fctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fctx.restore()}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fctx.clearRect(0,0,innerWidth,innerHeight)}
}
function flash(color){const f=$('#fxflash');f.style.setProperty('--fx',color);f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
let toastT;
function swalBase(){return window.Swal.mixin({heightAuto:false,scrollbarPadding:false,buttonsStyling:false,reverseButtons:true,customClass:{popup:'sw-pop',confirmButton:'sw-ok',cancelButton:'sw-no'}})}
function swalModalOpen(){try{if(!window.Swal||!Swal.isVisible())return false;const p=Swal.getPopup();return !!p&&!p.classList.contains('swal2-toast')}catch(e){return false}}
function toast(m,icon){
  if(window.Swal){try{swalBase().fire({toast:true,position:'top',showConfirmButton:false,timer:3200,timerProgressBar:true,icon:icon||'info',title:m,customClass:{popup:'sw-pop sw-toast'}});return}catch(e){}}
  const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);
}

function celebrate(){

  if(cq&&document.activeElement!==cq)cq.value=[0,5,10,15,20].includes(S.questions)?'':S.questions;
  if(pi)pi.textContent=`คลังคำถามตามระดับที่เลือก ${pc} ข้อ${S.questions>pc?` (จะใช้ ${pc} ข้อ)`:''}`;
  if(sm)sm.textContent=`${S.mode==='bell'?`แข่งกดกระดิ่ง ${S.players} ทีม`:'เล่นคนเดียว'} · ${S.minutes>0?S.minutes+' นาที':'ไม่จำกัดเวลา'} · ${use} ข้อ · ระดับ ${S.diffs.map(k=>DIFF[k]).join('/')} · ${S.order==='random'?'สุ่มคำถาม':'เรียงตามลำดับ'}`;
  const kv=(id,v)=>{const e=$(id);if(e)e.textContent=v};
  kv('#kQ',use+' ข้อ');kv('#kT',S.minutes>0?S.minutes+' นาที':'ไม่จำกัด');kv('#kL',S.diffs.map(k=>DIFF[k]).join(' / '));kv('#kP',S.mode==='bell'?S.players+' ทีม':'1 คน');
}

/* ====== สถานะเกม ====== */
let G=null,rafId=0,lastT=0;
function startGame(){
  ensureAudio();clearInterval(celeT);
  let pool=QUESTIONS.filter(q=>S.diffs.includes(q.d));
  if(!pool.length){toast('ไม่มีคำถามตามระดับที่เลือก','warning');return}
  let list=S.order==='random'?shuffle(pool):pool.slice();
  if(S.questions>0)list=list.slice(0,S.questions);
  const n=S.mode==='bell'?S.players:1;
  G={mode:S.mode,list,idx:-1,total:S.minutes>0?S.minutes*60:Infinity,timeLeft:S.minutes>0?S.minutes*60:Infinity,
     phase:'ready',cd:3,lastCd:4,paused:false,timeUp:false,arm:0,winner:null,ansLeft:0,lastSec:0,fbLeft:0,cur:null,last:null,history:[],
     players:Array.from({length:n},(_,i)=>({name:S.mode==='bell'?(S.names[i]||AV[i].n):'ผู้เล่น',score:0,answered:0,correct:0,wrong:0,timeout:0}))};
  screenName='game';document.body.dataset.bg='game';buildGame();renderTools();
  lastT=performance.now();cancelAnimationFrame(rafId);rafId=requestAnimationFrame(loop);
}
function buildGame(){
  const bell=G.mode==='bell';
  $('#screen').innerHTML=`
  <section class="game" data-mode="${G.mode}" data-phase="ready">
    <div class="glass hud">
      <div class="hq"><span class="hico">${svg('layers')}</span><div><span class="lbl">ข้อที่</span><div><b id="qn">1</b><span class="of">/ ${G.list.length}</span></div></div></div>
      <div class="ht" id="ht"><span class="hico">${svg('timer')}</span><div class="htb"><span class="lbl">เวลาที่เหลือของเกม</span><b id="tm">${isFinite(G.timeLeft)?fmt(G.timeLeft):'∞'}</b></div><div class="tbar"><i id="tfill"></i></div></div>
      <span class="keyhint">Esc หยุดชั่วคราว · ${bell?'Space ข้อต่อไป':'1–4 เลือกคำตอบ'}</span>
    </div>
    <div class="stage" id="stage">
      <div class="ready" aria-live="polite"><span>เตรียมตัวให้พร้อม</span><b id="cd">3</b></div>
      <div class="glass qcard"><div class="qbody"><div class="tags"><span class="tag" id="tTopic"></span><span class="tag" id="tDiff"></span></div>
        <p class="qtext" id="qtext"></p></div></div>
      <div class="glass status" id="status"></div>
      <div class="choices" id="choices" data-active="false"></div>
      <div class="explain" id="explain" hidden></div>
    </div>
    ${bell?`<div class="pads" id="pads" style="--n:${G.players.length}">${G.players.map((p,i)=>`
      <button class="pad" type="button" data-i="${i}" style="--pc:var(--p${i+1})" aria-label="กดกระดิ่ง ${esc(p.name)}">
        <span class="rk" hidden></span><span class="av" aria-hidden="true">${AV[i].e}</span><span class="nm">${esc(p.name)}</span>
        <span class="sc">0</span><span class="bl" aria-hidden="true">${svg('bell')}</span><kbd>${KEYL[i]}</kbd></button>`).join('')}</div>`
    :`<div class="tiles"><div class="glass tile"><span class="ico">${svg('target')}</span><div class="tt"><span class="tl">ตอบแล้ว (ข้อ)</span><b id="sAns">0</b></div></div><div class="glass tile"><span class="ico">${svg('check')}</span><div class="tt"><span class="tl">ตอบถูก (ข้อ)</span><b id="sOk">0</b></div></div><div class="glass tile score"><span class="ico">${svg('trophy')}</span><div class="tt"><span class="tl">คะแนนรวม</span><b id="sSc">0</b></div></div></div>`}
  </section>`;
  if(bell){
    $('#pads').addEventListener('pointerdown',e=>{const b=e.target.closest('.pad');if(!b)return;e.preventDefault();ensureAudio();buzz(+b.dataset.i)});
    $('#pads').addEventListener('click',e=>{const b=e.target.closest('.pad');if(b&&e.detail===0)buzz(+b.dataset.i)});
  }
  setPhaseUI();updateHud();
}
function loop(now){
  rafId=requestAnimationFrame(loop);
  if(!G){return}
  const dt=Math.min((now-lastT)/1000,.1);lastT=now;
  if(G.paused||G.phase==='ended')return;
  const ph=G.phase;
  if(ph==='ready'){
    G.cd-=dt;const c=Math.ceil(G.cd);
    if(c!==G.lastCd&&c>0){G.lastCd=c;$('#cd').textContent=c;SFX.ready(1)}
    if(G.cd<=0){SFX.ready(0);nextQuestion()}
    return;
  }
  if(ph==='question'||ph==='answering'){
    if(isFinite(G.timeLeft)){G.timeLeft-=dt;if(G.timeLeft<=0){G.timeLeft=0;G.timeUp=true}}
    if(G.arm>0)G.arm-=dt;
  }
  if(ph==='answering'){
    G.ansLeft-=dt;
    const sec=Math.ceil(Math.max(G.ansLeft,0));
    if(sec!==G.lastSec&&sec>0){G.lastSec=sec;SFX.tick(sec<=1)}
    updateRing();
    if(G.ansLeft<=0){resolve({timeout:true});return}
  }
  if(ph==='question'&&G.timeUp){endGame();return}
  if(ph==='feedback'&&isFinite(G.fbLeft)){
    G.fbLeft-=dt;const f=$('#fbfill');if(f)f.style.width=Math.max(0,G.fbLeft/G.fbTotal*100)+'%';
    if(G.fbLeft<=0)advance();
  }
  updateHud();
}
function updateHud(){
  if(!G)return;
  const tm=$('#tm');if(!tm)return;
  const hk=G.idx+'|'+(isFinite(G.timeLeft)?Math.floor(G.timeLeft*4):'i');if(G._hk===hk)return;G._hk=hk;
  tm.textContent=isFinite(G.timeLeft)?fmt(G.timeLeft):'∞';
  $('#tfill').style.width=isFinite(G.timeLeft)?(G.timeLeft/G.total*100)+'%':'100%';
  $('#ht').classList.toggle('low',isFinite(G.timeLeft)&&G.timeLeft<=10&&G.timeLeft>0);
  $('#qn').textContent=Math.max(1,G.idx+1);
}

/* ====== วงจรคำถาม ====== */
function nextQuestion(){
  G.idx++;
  if(G.idx>=G.list.length){endGame();return}
  const q=G.list[G.idx];
  const order=shuffle([...q.c.keys()]);
  G.cur={q,choices:order.map(i=>q.c[i]),ans:order.indexOf(0)};
  G.phase='question';G.winner=G.mode==='solo'?0:null;G.arm=.45;G.last=null;
  $('#tTopic').textContent=q.t||'ทั่วไป';
  const td=$('#tDiff');td.textContent='ระดับ'+DIFF[q.d];td.className='tag d-'+q.d;
  $('#qtext').textContent=q.q;
  $('#choices').innerHTML=G.cur.choices.map((t,i)=>`<button class="choice" type="button" data-i="${i}"><span class="lab">${LAB[i]}</span><span class="txt">${esc(t)}</span><kbd>${i+1}</kbd></button>`).join('');
  const ex=$('#explain');ex.hidden=true;ex.innerHTML='';
  $('#stage').scrollTop=0;
  $$('.pad .delta').forEach(d=>d.remove());
  setPhaseUI();updateHud();updateScores();
}
function buzz(i){
  if(!G||G.mode!=='bell'||G.paused||G.phase!=='question'||G.arm>0||i>=G.players.length)return;
  G.winner=i;G.phase='answering';G.ansLeft=ANSWER_SECS;G.lastSec=ANSWER_SECS+1;
  SFX.bell();flash(`var(--p${i+1})`);
  setPhaseUI();updateRing();
}
function pick(i){
  if(!G||G.paused||!G.cur||i<0||i>=G.cur.choices.length)return;
  if(G.mode==='solo'){if(G.phase!=='question'||G.arm>0)return}
  else if(G.phase!=='answering')return;
  resolve({idx:i});
}
function resolve(res){
  const c=G.cur,p=G.players[G.winner];
  const kind=res.timeout?'timeout':(res.idx===c.ans?'correct':'wrong');
  const delta=kind==='correct'?PTS_OK:-PTS_BAD;
  p.score+=delta;p.answered++;p[kind==='correct'?'correct':kind]++;
  G.history.push({q:c.q,kind,who:G.winner,chosen:res.timeout?null:c.choices[res.idx]});
  G.last={kind,delta,idx:res.idx,who:G.winner};
  G.phase='feedback';G.fbTotal=S.fbSecs;G.fbLeft=S.fbSecs>0?S.fbSecs:Infinity;
  setPhaseUI();updateScores(true);
  const pad=$(`.pad[data-i="${G.winner}"]`);
  if(kind==='correct'){
    SFX.correct();flash('#13c27a');
    const r=(pad||$('.tile.score')||$('.qcard')).getBoundingClientRect();
    confetti(r.left+r.width/2,r.top+r.height/3,70,1);
  }else{
    (kind==='timeout'?SFX.timeout:SFX.wrong)();flash('#e0364a');shake($('#stage'));
  }
}
function advance(){
  if(!G||G.paused||G.phase!=='feedback')return;
  if(G.timeUp){endGame();return}
  nextQuestion();
}
function skip(){
  if(!G||G.paused||G.mode!=='solo'||G.phase!=='question'||G.arm>0)return;
  G.history.push({q:G.cur.q,kind:'skip',who:0,chosen:null});
  nextQuestion();
}

/* ====== วาดหน้าจอเกมตามสถานะ ====== */
function setPhaseUI(){
  const g=$('.game');if(!g||!G)return;
  g.dataset.phase=G.phase;g.classList.toggle('paused',G.paused);
  const bell=G.mode==='bell',ph=G.phase;
  $$('.pad',g).forEach((b,i)=>{
    b.classList.toggle('winner',bell&&G.winner===i&&(ph==='answering'||ph==='feedback'));
    b.classList.toggle('locked',ph==='answering'&&G.winner!==i);
  });
  const ch=$('#choices');
  ch.dataset.active=String((!bell&&ph==='question')||(bell&&ph==='answering'));
  if(ph==='feedback'&&G.last){
    $$('.choice',ch).forEach((b,i)=>{
      b.classList.toggle('correct',i===G.cur.ans);
      b.classList.toggle('wrong',i===G.last.idx&&i!==G.cur.ans);
      b.classList.toggle('dim',i!==G.cur.ans&&i!==G.last.idx);
    });
    const ex=$('#explain');ex.hidden=false;
    ex.innerHTML=`<b>เฉลย:</b> ${esc(G.cur.choices[G.cur.ans])}<p>${esc(G.cur.q.x)}</p>`;
    requestAnimationFrame(()=>ex.scrollIntoView({block:'nearest',behavior:reduceMotion()?'auto':'smooth'}));
  }
  renderStatus();
}
function renderStatus(){
  const st=$('#status');if(!st)return;
  const bell=G.mode==='bell',ph=G.phase;let cls='s-'+ph,h='';
  if(ph==='question'){
    h=bell?`<div class="st-main"><span class="big">${svg('bell')}กดกระดิ่งเพื่อแย่งสิทธิ์ตอบ!</span><span class="sub">ผู้ที่กดก่อนมีเวลาตอบ ${ANSWER_SECS} วินาที ถ้าไม่ตอบถือว่าผิด</span></div>`
      :`<div class="st-main"><span class="big">เลือกคำตอบที่ถูกต้อง</span><span class="sub">กดตัวเลือกบนหน้าจอ หรือกดเลข 1–4</span></div><button class="btn small" type="button" data-act="skip">${svg('skip')}ข้ามข้อนี้</button>`;
  }else if(ph==='answering'){
    const w=G.winner;
    h=`<div class="st-main"><span class="big"><span aria-hidden="true">${AV[w].e}</span>${esc(G.players[w].name)} ได้สิทธิ์ตอบ!</span><span class="sub">เลือกคำตอบให้ทันใน ${ANSWER_SECS} วินาที (กดเลข 1–4 หรือแตะหน้าจอ)</span></div>
    <div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="42"/><circle class="fgc" id="ringfg" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg><b id="ringn">${ANSWER_SECS}</b></div>`;
  }else if(ph==='feedback'&&G.last){
    const L=G.last,who=bell?G.players[L.who].name+' ':'';
    const t=L.kind==='correct'?`${who}ตอบถูก! +${PTS_OK} คะแนน`:L.kind==='wrong'?`${who}ตอบผิด −${PTS_BAD} คะแนน`:`${who}หมดเวลา! −${PTS_BAD} คะแนน`;
    const ic=L.kind==='correct'?'check':L.kind==='wrong'?'x':'timer';
    cls='s-'+L.kind;
    h=`<div class="st-main"><span class="big">${svg(ic)}${esc(t)}</span><span class="sub">${G.timeUp?'หมดเวลาเกมแล้ว กดต่อเพื่อดูผลสรุป':'อ่านเฉลยด้านล่าง'}</span></div>
    <button class="btn small primary" type="button" data-act="next">${G.timeUp?'ดูผลสรุป':'ข้อต่อไป'}${svg('arrow')}</button>${isFinite(G.fbLeft)?'<div class="fbbar"><i id="fbfill"></i></div>':''}`;
  }
  st.className='glass status '+cls;st.innerHTML=h;
}
function updateRing(){
  const fg=$('#ringfg');if(!fg||!G)return;
  const f=Math.max(0,G.ansLeft/ANSWER_SECS);
  fg.setAttribute('stroke-dashoffset',String(263.9*(1-f)));
  const n=Math.max(1,Math.ceil(G.ansLeft));
  const b=$('#ringn');if(b)b.textContent=n;
  const r=$('#ring');if(r)r.classList.toggle('hot',G.ansLeft<=1);
}
function rankOf(){
  const sc=G.players.map(p=>p.score),max=Math.max(...sc),min=Math.min(...sc);
  return {ranks:sc.map(s=>1+sc.filter(o=>o>s).length),spread:max!==min};
}
function floatDelta(host,d){
  if(!host)return;
  const e=document.createElement('span');e.className='delta '+(d>0?'up':'down');e.textContent=(d>0?'+':'−')+Math.abs(d);
  host.appendChild(e);setTimeout(()=>e.remove(),1500);
}
function updateScores(animate){
  if(!G)return;
  if(G.mode==='bell'){
    const {ranks,spread}=rankOf();
    $$('.pad').forEach((b,i)=>{
      $('.sc',b).textContent=G.players[i].score;
      const rk=$('.rk',b);rk.hidden=!spread;rk.textContent='#'+ranks[i];
    });
    if(animate&&G.last)floatDelta($(`.pad[data-i="${G.last.who}"]`),G.last.delta);
  }else{
    const p=G.players[0];
    $('#sAns').textContent=p.answered;$('#sOk').textContent=p.correct;$('#sSc').textContent=p.score;
    if(animate&&G.last)floatDelta($('.tile.score'),G.last.delta);
  }
}

/* ====== จบเกม / สรุปผล ====== */
function endGame(){
  if(!G||G.phase==='ended')return;
  G.phase='ended';screenName='result';document.body.dataset.bg='game';renderTools();
  const bell=G.mode==='bell';
  const sorted=G.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  const top=sorted[0].p.score,winners=sorted.filter(o=>o.p.score===top);
  const ranks=G.players.map(p=>1+G.players.filter(o=>o.score>p.score).length);
  const played=G.history.filter(h=>h.kind!=='skip');
  const review=`<details class="glass rev"><summary>ทบทวนเฉลยทั้ง ${G.history.length} ข้อที่เล่น</summary>${G.history.map((h,n)=>{
    const lab={correct:'ตอบถูก',wrong:'ตอบผิด',timeout:'หมดเวลา',skip:'ข้าม'}[h.kind];
    return `<div class="ritem"><span class="pill ${h.kind}">${lab}</span>${bell?`<small style="display:inline">${esc(G.players[h.who].name)}</small>`:''}<div><b>${n+1}. ${esc(h.q.q)}</b></div><div>เฉลย: ${esc(h.q.c[0])}</div><small>${esc(h.q.x)}</small></div>`}).join('')}</details>`;
  let html='';
  if(bell){
    const maxAbs=Math.max(1,...G.players.map(p=>Math.abs(p.score)));
    const title=winners.length>1?'เสมอกัน! '+winners.map(w=>w.p.name).join(' และ '):winners[0].p.name+' ชนะ!';
    html=`<div class="win"><span class="em">${svg(winners.length>1?'users':'trophy')}</span><span class="lbl">ผลการแข่งขัน</span><h2>${esc(title)}</h2></div>
    <div class="board">${sorted.map(({p,i})=>`<div class="glass rrow ${ranks[i]===1?'first':''}" style="--pc:var(--p${i+1})"><span class="no">${ranks[i]}</span>
      <div class="who"><span aria-hidden="true">${AV[i].e}</span><div>${esc(p.name)}<small>ตอบถูก ${p.correct} · ตอบผิด ${p.wrong} · หมดเวลา ${p.timeout}</small></div></div><span class="pt">${p.score}</span>
      <div class="barw"><i style="width:${Math.max(0,p.score)/maxAbs*100}%"></i></div></div>`).join('')}</div>`;
  }else{
    const p=G.players[0],acc=p.answered?Math.round(p.correct/p.answered*100):0;
    const msg=!p.answered?'ยังไม่ได้ตอบข้อใดเลย ลองเล่นอีกครั้งนะ':acc>=80?'ยอดเยี่ยม! เข้าใจเนื้อหาได้ดีมาก':acc>=50?'ทำได้ดี ลองทบทวนข้อที่พลาดแล้วเล่นอีกครั้ง':'ลองทบทวนเนื้อหาอีกรอบ แล้วกลับมาเล่นใหม่';
    const tp=[...new Set(played.map(h=>h.q.t))].map(t=>{const hs=played.filter(h=>h.q.t===t),ok=hs.filter(h=>h.kind==='correct').length;return {t,n:hs.length,ok}}).filter(x=>x.n);
    const stat=(ic,l,v)=>`<div class="glass stat"><span class="ico">${svg(ic)}</span><div class="st"><span class="sl">${l}</span><b>${v}</b></div></div>`;
    html=`<div class="win"><span class="em">${svg(acc>=80?'trophy':acc>=50?'award':'target')}</span><span class="lbl">${p.name?esc(p.name)+' · ':''}คะแนนรวม</span><h2>${p.score} คะแนน</h2></div>
    <div class="stats">${stat('target','ตอบแล้ว',p.answered)}${stat('check','ตอบถูก',p.correct)}${stat('x','ตอบผิด / หมดเวลา',p.wrong+p.timeout)}${stat('award','ความแม่นยำ',acc+'%')}</div>
    <p class="msg">${msg}</p>
    ${tp.length?`<div class="glass panel"><p class="pt2">ผลแยกตามหัวข้อ</p><div class="topics">${tp.map(x=>`<div class="topic"><span>${esc(x.t)}</span><b>${x.ok}/${x.n} ข้อ</b><div class="tb"><i style="width:${x.ok/x.n*100}%"></i></div></div>`).join('')}</div></div>`:''}`;
  }
  $('#screen').innerHTML=`<div class="result">${html}${G.history.length?review:''}<div class="resacts"><button class="btn primary" type="button" data-act="again">${svg('restart')}เล่นอีกครั้ง</button><button class="btn" type="button" data-act="setup">กลับหน้าหลัก</button></div></div>`;
  $('#screen').scrollTop=0;
  if(typeof reportResult==='function')reportResult();
  const good=bell?top>0:(G.players[0].answered&&G.players[0].correct/G.players[0].answered>=.5);
  if(good){SFX.fanfare();celebrate()}else{SFX.tick(false)}
}

/* ====== หยุดชั่วคราว / กล่องข้อความ ====== */
let ovKind=null;
function openOv(kind){
  ovKind=kind;
  if(G&&G.phase!=='ended'&&screenName==='game'){G.paused=true;const g=$('.game');if(g)g.classList.add('paused')}
  const ov=$('#ov');let h='';
  if(kind==='pause')h=`<h2>${svg('pause')} หยุดชั่วคราว</h2><p>เวลาและคำถามหยุดนิ่งไว้ให้แล้ว</p><div class="acts"><button class="btn primary" data-act="resume" type="button">${svg('play')}เล่นต่อ</button><button class="btn" data-act="restart" type="button">${svg('restart')}เริ่มเกมใหม่</button><button class="btn" data-act="setup" type="button">กลับหน้าหลัก</button></div>`;
  if(kind==='restart')h=`<h2>เริ่มเกมใหม่?</h2><p>คะแนนและความคืบหน้าตอนนี้จะถูกล้าง แล้วเริ่มนับเวลาใหม่ด้วยการตั้งค่าเดิม</p><div class="acts"><button class="btn gold" data-act="restartgo" type="button">เริ่มใหม่เลย</button><button class="btn" data-act="resume" type="button">ยกเลิก</button></div>`;
  if(kind==='game')h=`<h2>${svg('gear')} ตั้งค่าเกม</h2>${setInfoHTML()}${gameRowsHTML()}<div class="acts"><button class="btn primary" data-act="resume" type="button">เสร็จสิ้น</button></div><p class="copy">${COPYRIGHT}</p>`;
  if(kind==='bank')h=bankHTML();
  if(kind==='display')h=`<h2>${svg('type')} ตั้งค่าการแสดงผล</h2>
    <div class="row"><span class="lb">ขนาดตัวอักษร</span><div class="chips">${[[.9,'เล็ก'],[1,'ปกติ'],[1.2,'ใหญ่'],[1.4,'ใหญ่มาก']].map(([v,l])=>`<button class="chip" type="button" data-disp="font" data-val="${v}">${l}</button>`).join('')}</div></div>
    <div class="row"><span class="lb">รูปแบบหน้าจอ</span><div class="chips">${[['auto','ตามอุปกรณ์'],['light','สว่าง'],['dark','มืด']].map(([v,l])=>`<button class="chip" type="button" data-disp="theme" data-val="${v}">${l}</button>`).join('')}</div></div>
    <div class="row"><span class="lb">เสียงประกอบ</span><div class="chips"><button class="chip" type="button" data-disp="sound" data-val="true">เปิด</button><button class="chip" type="button" data-disp="sound" data-val="false">ปิด</button>
      <input type="range" id="vol" min="0.1" max="1" step="0.1" value="${S.vol}" aria-label="ความดังของเสียง"><button class="chip" type="button" data-act="testsound">ลองเสียง</button></div></div>
    <div class="acts"><button class="btn primary" data-act="resume" type="button">${G&&G.paused?'ปิดและเล่นต่อ':'ปิด'}</button></div>`;
  ov.innerHTML=`<div class="dlg glass${kind==='bank'?' wide':''}" role="dialog" aria-modal="true">${h}</div>`;
  ov.hidden=false;syncDisp();renderNames();syncSetup();
  const f=$('#ov .btn');if(f)f.focus();
}
function closeOv(){
  $('#ov').hidden=true;ovKind=null;syncSetup();
  if(G&&G.phase!=='ended'){G.paused=false;lastT=performance.now();const g=$('.game');if(g)g.classList.remove('paused')}
}
function syncDisp(){
  $$('#ov [data-disp]').forEach(b=>{const k=b.dataset.disp;b.classList.toggle('on',String(S[k])===b.dataset.val)});
}
let pend=null,delArm=null;
function bankHTML(){
  return `<h2>${svg('lib')} คลังคำถาม</h2>
  <div class="row"><span class="lb">ชุดคำถามที่ใช้เล่น</span><div class="sets">${allSets().map(x=>`<div class="setrow${x.id===S.setId?' on':''}"><button class="setpick" type="button" data-act="set-use" data-id="${esc(x.id)}" aria-pressed="${x.id===S.setId}"><b>${esc(x.name)}</b><small>${x.qs.length} ข้อ${x.builtin?' · ชุดตัวอย่าง':''}</small></button>${x.builtin?'':`<button class="btn small" type="button" data-act="set-del" data-id="${esc(x.id)}">${delArm===x.id?'กดอีกครั้งเพื่อลบ':'ลบ'}</button>`}</div>`).join('')}</div></div>
  <div class="row"><span class="lb">นำเข้าชุดคำถามใหม่ (ใช้ได้ทุกวิชา)</span>
    <input class="txtin" id="impName" type="text" maxlength="60" placeholder="ชื่อวิชาหรือชุดคำถาม เช่น วิทยาศาสตร์ ม.2 บทที่ 3" aria-label="ชื่อชุดคำถาม">
    <textarea class="txtarea" id="impText" rows="5" placeholder="วางข้อมูลที่คัดลอกจาก Google Sheet หรือ Excel ที่นี่ (รวมแถวหัวตาราง)" aria-label="วางข้อมูลคำถาม"></textarea>
    <div class="chips"><button class="btn small" type="button" data-act="imp-check">ตรวจข้อมูลที่วาง</button><button class="btn small" type="button" data-act="imp-file">เลือกไฟล์ .xlsx / .csv</button><button class="btn small" type="button" data-act="imp-tpl">คัดลอกหัวตาราง</button><input type="file" id="impFile" accept=".xlsx,.xls,.csv,.tsv,.txt" hidden></div>
    <span class="hint">คอลัมน์: หัวข้อ | ระดับ (ง่าย/กลาง/ยาก) | คำถาม | คำตอบที่ถูก | ตัวเลือกผิด 1–3 | คำอธิบาย เกมสลับตำแหน่งตัวเลือกให้เอง</span>
    <div id="impReport" aria-live="polite"></div></div>
  <div class="acts"><button class="btn primary" data-act="resume" type="button">ปิด</button></div>`;
}
function runImport(rows){
  const r=buildQuestions(rows);pend=r;const el=$('#impReport');if(!el)return;
  if(r.error){el.innerHTML=`<div class="rep bad">${esc(r.error)}</div>`;return}
  const lv={e:0,m:0,h:0};r.qs.forEach(q=>lv[q.d]++);
  const notes=[...r.skipped.map(x=>`แถว ${x.row}: ข้าม (${x.reason})`),...r.warns.map(x=>`แถว ${x.row}: ${x.reason}`)];
  el.innerHTML=`<div class="rep ${r.qs.length?'ok':'bad'}"><b>นำเข้าได้ ${r.qs.length} ข้อ</b>${r.skipped.length?` · ข้าม ${r.skipped.length} แถว`:''}<br><small>ง่าย ${lv.e} · กลาง ${lv.m} · ยาก ${lv.h}</small>${notes.length?`<ul>${notes.slice(0,8).map(t=>`<li>${esc(t)}</li>`).join('')}${notes.length>8?`<li>และอีก ${notes.length-8} รายการ</li>`:''}</ul>`:''}</div>${r.qs.length?'<button class="btn gold small" type="button" data-act="imp-save" style="margin-top:.6rem">บันทึกเป็นชุดและใช้เลย</button>':''}`;
}
function refreshAfterSetChange(){
  if(screenName!=='game')showSetup();
}
function resumeAfterConfirm(){if(G&&G.phase!=='ended'&&screenName==='game'){G.paused=false;lastT=performance.now();const g=$('.game');if(g)g.classList.remove('paused')}}
function confirmRestart(){
  if(!window.Swal){openOv('restart');return}
  const ov=$('#ov');if(ov&&!ov.hidden){ov.hidden=true;ovKind=null}
  if(G&&G.phase!=='ended'&&screenName==='game'){G.paused=true;const g=$('.game');if(g)g.classList.add('paused')}
  swalBase().fire({icon:'warning',title:'เริ่มเกมใหม่?',text:'คะแนนและความคืบหน้าตอนนี้จะถูกล้าง แล้วเริ่มนับเวลาใหม่ด้วยการตั้งค่าเดิม',showCancelButton:true,confirmButtonText:'เริ่มใหม่เลย',cancelButtonText:'ยกเลิก'})
    .then(r=>{if(r.isConfirmed)startGame();else resumeAfterConfirm()});
}
function togglePause(){
  if(!G||G.phase==='ended'||screenName!=='game')return;
  if(ovKind)closeOv();else openOv('pause');
}

/* ====== เหตุการณ์ ====== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){
    ensureAudio();
    switch(a.dataset.act){
      case 'start':startGame();break;
      case 'pause':togglePause();break;
      case 'resume':closeOv();break;
      case 'restart':confirmRestart();break;
      case 'restartgo':$('#ov').hidden=true;ovKind=null;startGame();break;
      case 'again':startGame();break;
      case 'setup':{
        const go=()=>{$('#ov').hidden=true;ovKind=null;showSetup()};
        if(window.Swal&&G&&G.phase!=='ended'&&screenName==='game'){
          swalBase().fire({icon:'question',title:'กลับหน้าหลัก?',text:'เกมที่กำลังเล่นอยู่จะสิ้นสุดและคะแนนจะไม่ถูกบันทึก',showCancelButton:true,confirmButtonText:'กลับหน้าหลัก',cancelButtonText:'เล่นต่อ'}).then(r=>{if(r.isConfirmed)go()});
        }else go();
        break}
      case 'sound':S.sound=!S.sound;save();applyDisplay();renderTools();break;
      case 'display':openOv('display');break;
      case 'gear':openOv('game');break;
      case 'bank':openOv('bank');break;
      case 'set-use':useSet(a.dataset.id,true);delArm=null;refreshAfterSetChange();openOv('bank');break;
      case 'set-del':{
        const id=a.dataset.id,nm=(CUSTOM.find(x=>x.id===id)||{}).name||'';
        const doDel=()=>{CUSTOM=CUSTOM.filter(x=>x.id!==id);saveSets();if(S.setId===id)useSet('law',true);refreshAfterSetChange();openOv('bank');toast('ลบชุดคำถามแล้ว','success')};
        if(window.Swal){swalBase().fire({icon:'warning',title:'ลบชุดคำถามนี้?',text:`“${nm}” จะถูกลบออกจากเบราว์เซอร์นี้`,showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก'}).then(r=>{if(r.isConfirmed)doDel()})}
        else doDel();
        break}
      case 'imp-check':runImport(parseDelimited($('#impText').value));break;
      case 'imp-file':$('#impFile').click();break;
      case 'imp-tpl':{
        const tpl='หัวข้อ\tระดับ\tคำถาม\tคำตอบที่ถูก\tตัวเลือกผิด 1\tตัวเลือกผิด 2\tตัวเลือกผิด 3\tคำอธิบาย\nตัวอย่างหัวข้อ\tง่าย\t2 + 3 เท่ากับเท่าไร?\t5\t4\t6\t7\t2 บวก 3 ได้ 5';
        const fb=()=>{const t=$('#impText');if(t){t.value=tpl;t.select()}toast('คัดลอกอัตโนมัติไม่ได้ ใส่ข้อความในกล่องแล้ว กด Ctrl+C')};
        try{navigator.clipboard.writeText(tpl).then(()=>toast('คัดลอกหัวตารางแล้ว วางในแถวแรกของ Google Sheet ได้เลย','success'),fb)}catch(e){fb()}
        break}
      case 'imp-save':{
        if(!pend||!pend.qs||!pend.qs.length)break;
        const name=($('#impName').value.trim()||'ชุดที่นำเข้า').slice(0,60);
        let ex=CUSTOM.find(x=>x.name===name);
        if(ex)ex.qs=pend.qs;else{ex={id:'u'+Date.now().toString(36),builtin:false,name,subject:name,title:'สั่นกระดิ่งพิชิตชัย',indicator:'',qs:pend.qs};CUSTOM.push(ex)}
        saveSets();useSet(ex.id,true);pend=null;closeOv();refreshAfterSetChange();
        toast(`นำเข้า ${ex.qs.length} ข้อแล้ว ใช้ชุด “${name}”`,'success');break}
      case 'full':toggleFull();break;
      case 'next':advance();break;
      case 'skip':skip();break;
      case 'testsound':SFX.bell();break;
    }
    return;
  }
  const d=e.target.closest('[data-disp]');
  if(d){
    ensureAudio();const k=d.dataset.disp,v=d.dataset.val;
    S[k]=k==='font'?+v:k==='sound'?v==='true':v;save();applyDisplay();syncDisp();renderTools();
    if(k==='sound'&&S.sound)SFX.bell();
    return;
  }
  const t=e.target.closest('[data-set]');
  if(t){
    const k=t.dataset.set,raw=t.dataset.val;
    S[k]=['mode','order'].includes(k)?raw:+raw;
    if(k==='players')renderNames();
    save();syncSetup();return;
  }
  const df=e.target.closest('[data-diff]');
  if(df){
    const k=df.dataset.diff,i=S.diffs.indexOf(k);
    if(i>-1){if(S.diffs.length>1)S.diffs.splice(i,1);else toast('ต้องเลือกอย่างน้อย 1 ระดับ','warning')}else S.diffs.push(k);
    save();syncSetup();return;
  }
  const c=e.target.closest('.choice');
  if(c&&G)pick(+c.dataset.i);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cMin'){const v=Math.round(+t.value);if(v>=1)S.minutes=Math.min(60,v);save();syncSetup()}
  else if(t.id==='cQ'){const v=Math.round(+t.value);if(v>=1)S.questions=Math.min(QUESTIONS.length,v);save();syncSetup()}
  else if(t.dataset&&t.dataset.name!==undefined){S.names[+t.dataset.name]=t.value.trim()||AV[+t.dataset.name].n;save()}
  else if(t.id==='vol'){S.vol=+t.value;save();applyDisplay()}
});
document.addEventListener('keydown',e=>{
  if(swalModalOpen())return;
  if(e.target.matches&&e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'){if(ovKind)closeOv();else togglePause();return}
  if(!G||screenName!=='game'||G.paused||e.repeat)return;
  ensureAudio();
  if(G.mode==='bell'){const i=KEYC.indexOf(e.code);if(i>-1&&i<G.players.length){e.preventDefault();buzz(i);return}}
  const m=/^(?:Digit|Numpad)([1-4])$/.exec(e.code);
  if(m){pick(+m[1]-1);return}
  if((e.code==='Space'||e.code==='Enter')&&G.phase==='feedback'){e.preventDefault();advance()}
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='impFile'||!e.target.files[0])return;
  const f=e.target.files[0],nm=$('#impName');
  if(nm&&!nm.value.trim())nm.value=f.name.replace(/\.[^.]+$/,'');
  const rp=$('#impReport');if(rp)rp.innerHTML='<div class="rep">กำลังอ่านไฟล์…</div>';
  try{runImport(await readFileRows(f))}
  catch(err){if(rp)rp.innerHTML='<div class="rep bad">อ่านไฟล์ไม่ได้ ถ้าเป็น .xlsx ให้ตรวจว่าเชื่อมต่ออินเทอร์เน็ต หรือลองบันทึกเป็น .csv แล้วเลือกใหม่ หรือคัดลอกช่องแล้ววางแทน</div>'}
  e.target.value='';
});
document.addEventListener('visibilitychange',()=>{lastT=performance.now()});

applyDisplay();showSetup();
</script>
